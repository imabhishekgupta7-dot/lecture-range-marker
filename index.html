<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#FAF9F5" id="meta-theme-color" />
  <meta name="description" content="Mark and export timestamp ranges from YouTube lectures." />
  <title>Lecture Range Marker</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #FAF9F5;
      --surface: #FFFFFF;
      --surface-subtle: #F3F1EA;
      --border: #E8E6DC;
      --text: #141413;
      --text-muted: #6B6962;
      --accent: #C6613F;
      --accent-hover: #B15232;
      --accent-soft: rgba(198, 97, 63, 0.12);
      --danger: #B83A2D;
      --shadow: 0 2px 10px rgba(20, 20, 19, 0.04);
      --radius-lg: 16px;
      --radius-md: 12px;
      --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #262624;
      --surface: #30302E;
      --surface-subtle: #3A3A37;
      --border: #42423E;
      --text: #FAF9F5;
      --text-muted: #A8A59E;
      --accent: #D97757;
      --accent-hover: #E38667;
      --accent-soft: rgba(217, 119, 87, 0.16);
      --danger: #E06658;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.5;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    .app-container {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 16px 72px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px;
    }

    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-logo { width: 26px; height: 26px; flex-shrink: 0; color: var(--accent); }

    h1 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theme-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1.2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: var(--shadow);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .url-row { display: flex; gap: 8px; }

    input[type="text"] {
      width: 100%;
      min-width: 0;
      min-height: 46px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 1rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    .btn {
      min-height: 46px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #FFFFFF; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface-subtle); color: var(--text); border-color: var(--border); }
    .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Cinema / Fullscreen Stage */
    .cinema-stage {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .player-card {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #141413;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .player-placeholder {
      color: #A8A59E;
      font-size: 0.92rem;
      text-align: center;
      padding: 20px;
      max-width: 280px;
    }

    .player-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .player-hint {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .fs-btn {
      min-height: 44px;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .recorder-stack { display: flex; flex-direction: column; gap: 12px; }

    .field-label {
      display: block;
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .record-btn {
      width: 100%;
      min-height: 58px;
      border-radius: var(--radius-md);
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      gap: 2px;
    }

    .record-btn.is-recording {
      background: var(--surface);
      color: var(--accent);
      border: 2px solid var(--accent);
    }

    .record-subtext {
      font-size: 0.85rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      opacity: 0.92;
    }

    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 6px;
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    /* Fullscreen Mode Styling (Native Fullscreen OR Fallback Cinema Mode) */
    .cinema-stage:fullscreen,
    .cinema-stage.is-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 900;
      width: 100vw;
      height: 100dvh;
      background: #0D0D0C;
      padding: 0;
      gap: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cinema-stage:fullscreen .player-card,
    .cinema-stage.is-fullscreen .player-card {
      flex: 1;
      min-height: 0;
      border: 0;
      border-radius: 0;
      background: #0D0D0C;
      box-shadow: none;
      justify-content: center;
    }

    .cinema-stage:fullscreen .video-wrapper,
    .cinema-stage.is-fullscreen .video-wrapper {
      width: 100%;
      height: 100%;
      max-height: 100%;
      aspect-ratio: auto;
    }

    .cinema-stage:fullscreen .player-toolbar,
    .cinema-stage.is-fullscreen .player-toolbar {
      display: none;
    }

    .cinema-stage:fullscreen .recorder-stack,
    .cinema-stage.is-fullscreen .recorder-stack {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 0;
      border: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(20, 20, 19, 0.94);
      backdrop-filter: blur(8px);
    }

    .cinema-stage:fullscreen .field-label,
    .cinema-stage.is-fullscreen .field-label {
      display: none;
    }

    .cinema-stage:fullscreen .label-wrap,
    .cinema-stage.is-fullscreen .label-wrap {
      flex: 1;
      min-width: 0;
    }

    .cinema-stage:fullscreen .recorder-stack input[type="text"],
    .cinema-stage.is-fullscreen .recorder-stack input[type="text"] {
      min-height: 44px;
      padding: 8px 12px;
      font-size: 0.92rem;
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: #FAF9F5;
    }

    .cinema-stage:fullscreen .record-btn,
    .cinema-stage.is-fullscreen .record-btn {
      width: auto;
      min-width: 148px;
      min-height: 44px;
      padding: 6px 14px;
      font-size: 0.92rem;
      flex-shrink: 0;
    }

    .cinema-stage:fullscreen .record-btn.is-recording,
    .cinema-stage.is-fullscreen .record-btn.is-recording {
      background: #262624;
      color: #D97757;
      border-color: #D97757;
    }

    .cinema-stage:fullscreen .record-subtext,
    .cinema-stage.is-fullscreen .record-subtext {
      font-size: 0.78rem;
    }

    .exit-fs-btn {
      display: none;
    }

    .cinema-stage:fullscreen .exit-fs-btn,
    .cinema-stage.is-fullscreen .exit-fs-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: 0 10px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.1);
      color: #FAF9F5;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .ranges-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    h2 { margin: 0; font-family: var(--font-serif); font-size: 1.15rem; font-weight: 600; }
    .action-group { display: flex; gap: 8px; width: 100%; }
    .action-group .btn { flex: 1; min-height: 44px; padding: 8px 12px; font-size: 0.9rem; }

    .ranges-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

    .range-item {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .range-jump-btn {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      padding: 10px 12px;
      background: transparent;
      border: 0;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .range-jump-btn:active { background: var(--accent-soft); }
    .range-time { font-size: 0.95rem; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
    .range-label-text { font-family: var(--font-serif); font-size: 0.95rem; color: var(--text); word-break: break-word; }
    .range-label-empty { font-family: var(--font-sans); font-size: 0.85rem; color: var(--text-muted); font-style: italic; }

    .delete-btn {
      width: 46px;
      min-height: 48px;
      border: 0;
      border-left: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 1.15rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .delete-btn:hover, .delete-btn:active { color: var(--danger); background: rgba(184, 58, 45, 0.08); }

    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-muted);
      font-size: 0.93rem;
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 76px;
      transform: translate(-50%, 16px);
      background: #141413;
      color: #FAF9F5;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1000;
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    html[data-theme="dark"] .toast { background: #FAF9F5; color: #141413; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 3V29M4.74 9.5L27.26 22.5M27.26 9.5L4.74 22.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
        <h1>Lecture Range Marker</h1>
      </div>
      <button type="button" class="theme-btn" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">☾</button>
    </header>

    <section class="card" aria-label="Load YouTube Lecture">
      <div class="url-row">
        <input type="text" id="youtube-url" placeholder="Paste YouTube lecture link..." autocomplete="off" spellcheck="false" aria-label="YouTube video link" />
        <button type="button" class="btn btn-primary" id="load-btn">Load</button>
      </div>
    </section>

    <!-- Fullscreen Cinema Wrapper: Keeps Video + Range Controls together in Fullscreen -->
    <div class="cinema-stage" id="cinema-stage">
      <section class="card player-card" aria-label="Video Player">
        <div class="video-wrapper" id="video-wrapper">
          <div class="player-placeholder" id="player-placeholder">
            Paste a YouTube lecture link above and tap <strong>Load</strong> to begin.
          </div>
        </div>
        <div class="player-toolbar">
          <span class="player-hint">Use Study Fullscreen to keep controls visible</span>
          <button type="button" class="fs-btn" id="enter-fs-btn">⛶ Study Fullscreen</button>
        </div>
      </section>

      <section class="card recorder-stack" aria-label="Record Timestamp Range">
        <div class="label-wrap">
          <label class="field-label" for="range-label">Topic or note (optional)</label>
          <input type="text" id="range-label" placeholder="Topic / note (optional)..." maxlength="140" />
        </div>

        <button type="button" class="record-btn" id="record-toggle">
          <span id="record-main-text">Start range</span>
          <span class="record-subtext" id="record-sub-text">Tap when an important section begins</span>
        </button>

        <button type="button" class="exit-fs-btn" id="exit-fs-btn" title="Exit Fullscreen">✕ Exit</button>
      </section>
    </div>

    <section class="card" aria-label="Saved Ranges">
      <div class="ranges-header">
        <h2>Saved Ranges (<span id="range-count">0</span>)</h2>
        <div class="action-group">
          <button type="button" class="btn btn-secondary" id="copy-all-btn" disabled>Copy all</button>
          <button type="button" class="btn btn-secondary" id="export-txt-btn" disabled>Export .txt</button>
        </div>
      </div>

      <div id="ranges-container">
        <div class="empty-state">No ranges marked yet. Start playback and tap "Start range".</div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      let currentVideoId = null;
      let latestPlayerTime = 0;
      let isRecording = false;
      let startSeconds = null;
      let liveTimer = null;
      let ytPollTimer = null;
      let ranges = [];
      let toastTimer = null;

      const urlInput = document.getElementById("youtube-url");
      const loadBtn = document.getElementById("load-btn");
      const labelInput = document.getElementById("range-label");
      const recordBtn = document.getElementById("record-toggle");
      const recordMainText = document.getElementById("record-main-text");
      const recordSubText = document.getElementById("record-sub-text");
      const rangesContainer = document.getElementById("ranges-container");
      const rangeCountEl = document.getElementById("range-count");
      const copyAllBtn = document.getElementById("copy-all-btn");
      const exportTxtBtn = document.getElementById("export-txt-btn");
      const themeToggle = document.getElementById("theme-toggle");
      const metaThemeColor = document.getElementById("meta-theme-color");
      const videoWrapper = document.getElementById("video-wrapper");
      const placeholderEl = document.getElementById("player-placeholder");
      const cinemaStage = document.getElementById("cinema-stage");
      const enterFsBtn = document.getElementById("enter-fs-btn");
      const exitFsBtn = document.getElementById("exit-fs-btn");
      const toastEl = document.getElementById("toast");

      function safeGetStorage(key) {
        try { return window.localStorage.getItem(key); } catch (e) { return null; }
      }
      function safeSetStorage(key, value) {
        try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
      }

      // Theme
      const THEME_KEY = "lrm_theme_pref";
      const systemDarkQuery = window.matchMedia("(prefers-color-scheme: dark)");

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        themeToggle.textContent = theme === "dark" ? "☀" : "☾";
        metaThemeColor.setAttribute("content", theme === "dark" ? "#262624" : "#FAF9F5");
      }

      const savedTheme = safeGetStorage(THEME_KEY);
      applyTheme(savedTheme === "dark" || savedTheme === "light" ? savedTheme : (systemDarkQuery.matches ? "dark" : "light"));

      systemDarkQuery.addEventListener("change", (e) => {
        if (!safeGetStorage(THEME_KEY)) applyTheme(e.matches ? "dark" : "light");
      });

      themeToggle.addEventListener("click", () => {
        const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        safeSetStorage(THEME_KEY, next);
        applyTheme(next);
      });

      // Study Fullscreen (keeps Range Marker controls visible in fullscreen!)
      async function enterStudyFullscreen() {
        cinemaStage.classList.add("is-fullscreen");
        document.body.style.overflow = "hidden";
        try {
          if (cinemaStage.requestFullscreen) {
            await cinemaStage.requestFullscreen();
          } else if (cinemaStage.webkitRequestFullscreen) {
            await cinemaStage.webkitRequestFullscreen();
          }
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(() => {});
          }
        } catch (err) {
          // CSS fixed fullscreen fallback stays active
        }
      }

      async function exitStudyFullscreen() {
        cinemaStage.classList.remove("is-fullscreen");
        document.body.style.overflow = "";
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else if (document.webkitFullscreenElement) {
            await document.webkitExitFullscreen();
          }
          if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
          }
        } catch (err) {}
      }

      enterFsBtn.addEventListener("click", enterStudyFullscreen);
      exitFsBtn.addEventListener("click", exitStudyFullscreen);

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) {
          cinemaStage.classList.remove("is-fullscreen");
          document.body.style.overflow = "";
        }
      });

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2500);
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = String(str);
        return div.innerHTML;
      }

      function formatTime(totalSec) {
        const sec = Math.max(0, Math.floor(Number(totalSec) || 0));
        const hrs = Math.floor(sec / 3600);
        const mins = Math.floor((sec % 3600) / 60);
        const remSec = sec % 60;
        const mm = String(mins).padStart(2, "0");
        const ss = String(remSec).padStart(2, "0");
        return hrs > 0 ? `${hrs}:${mm}:${ss}` : `${mm}:${ss}`;
      }

      function extractVideoId(input) {
        const trimmed = input.trim();
        if (!trimmed) return null;
        if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;

        const patterns = [
          /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
          /(?:youtube\.com\/watch\?.*v=)([a-zA-Z0-9_-]{11})/,
          /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
          /(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
          /(?:youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,
          /(?:youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/
        ];
        for (const regex of patterns) {
          const m = trimmed.match(regex);
          if (m && m[1]) return m[1];
        }
        return null;
      }

      function sendYTCommand(func, args = []) {
        const iframe = document.getElementById("yt-player");
        if (!iframe || !iframe.contentWindow) return;
        iframe.contentWindow.postMessage(
          JSON.stringify({ event: "command", func: func, args: args }),
          "*"
        );
      }

      window.addEventListener("message", (event) => {
        if (typeof event.data !== "string") return;
        if (!event.origin.includes("youtube.com") && !event.origin.includes("youtube-nocookie.com")) return;
        try {
          const data = JSON.parse(event.data);
          if (data.info && typeof data.info.currentTime === "number") {
            latestPlayerTime = Math.floor(data.info.currentTime);
          }
        } catch (e) {}
      });

      function loadVideo(videoId) {
        if (placeholderEl) placeholderEl.style.display = "none";
        latestPlayerTime = 0;

        const oldIframe = document.getElementById("yt-player");
        if (oldIframe) oldIframe.remove();

        const iframe = document.createElement("iframe");
        iframe.id = "yt-player";
        iframe.title = "YouTube lecture player";
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        // Notice: We omit iframe allowFullscreen so users use "Study Fullscreen" and never lose the range buttons
        const originParam = window.location.origin && window.location.origin.startsWith("http")
          ? `&origin=${encodeURIComponent(window.location.origin)}`
          : "";

        iframe.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&playsinline=1&rel=0&fs=0${originParam}`;

        iframe.addEventListener("load", () => {
          iframe.contentWindow.postMessage(JSON.stringify({ event: "listening", id: 1 }), "*");
          clearInterval(ytPollTimer);
          ytPollTimer = setInterval(() => {
            iframe.contentWindow.postMessage(JSON.stringify({ event: "listening", id: 1 }), "*");
          }, 500);
        });

        videoWrapper.appendChild(iframe);
      }

      function storageKeyForVideo(videoId) { return `lrm_ranges_${videoId}`; }

      function loadRangesForVideo(videoId) {
        const raw = safeGetStorage(storageKeyForVideo(videoId));
        if (!raw) {
          ranges = [];
        } else {
          try {
            const parsed = JSON.parse(raw);
            ranges = Array.isArray(parsed) ? parsed : [];
          } catch (e) {
            ranges = [];
          }
        }
        renderRanges();
      }

      function saveRangesForVideo() {
        if (!currentVideoId) return;
        safeSetStorage(storageKeyForVideo(currentVideoId), JSON.stringify(ranges));
      }

      function handleLoadClick() {
        const videoId = extractVideoId(urlInput.value);
        if (!videoId) {
          showToast("Invalid YouTube link. Paste a video URL.");
          return;
        }
        resetRecordingState();
        currentVideoId = videoId;
        safeSetStorage("lrm_last_video_id", videoId);
        loadRangesForVideo(videoId);
        loadVideo(videoId);
        showToast("Lecture loaded.");
      }

      loadBtn.addEventListener("click", handleLoadClick);
      urlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleLoadClick();
        }
      });

      function resetRecordingState() {
        isRecording = false;
        startSeconds = null;
        clearInterval(liveTimer);
        liveTimer = null;
        recordBtn.classList.remove("is-recording");
        recordMainText.textContent = "Start range";
        recordSubText.textContent = "Tap when an important section begins";
      }

      function updateLiveRecordingUI() {
        if (!isRecording || startSeconds === null) return;
        recordMainText.innerHTML = `<span class="pulse-dot"></span>Stop range`;
        recordSubText.textContent = `${formatTime(startSeconds)} → ${formatTime(latestPlayerTime)}`;
      }

      recordBtn.addEventListener("click", () => {
        if (!currentVideoId) {
          showToast("Load a YouTube lecture first.");
          return;
        }

        if (!isRecording) {
          isRecording = true;
          startSeconds = latestPlayerTime;
          recordBtn.classList.add("is-recording");
          updateLiveRecordingUI();
          liveTimer = setInterval(updateLiveRecordingUI, 250);
        } else {
          let s = startSeconds;
          let e = latestPlayerTime;
          if (e < s) [s, e] = [e, s];

          const cleanLabel = labelInput.value.trim();
          ranges.push({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            start: s,
            end: e,
            label: cleanLabel
          });

          saveRangesForVideo();
          renderRanges();
          labelInput.value = "";
          resetRecordingState();
          showToast(`Saved ${formatTime(s)} - ${formatTime(e)}`);
        }
      });

      function renderRanges() {
        rangeCountEl.textContent = String(ranges.length);
        const hasItems = ranges.length > 0;
        copyAllBtn.disabled = !hasItems;
        exportTxtBtn.disabled = !hasItems;

        if (!hasItems) {
          rangesContainer.innerHTML = `<div class="empty-state">No ranges marked yet. Start playback and tap "Start range".</div>`;
          return;
        }

        rangesContainer.innerHTML = `<ul class="ranges-list">${ranges.map((item) => {
          const timeText = `${formatTime(item.start)} - ${formatTime(item.end)}`;
          const labelHtml = item.label
            ? `<span class="range-label-text">${escapeHtml(item.label)}</span>`
            : `<span class="range-label-empty">No label</span>`;

          return `
            <li class="range-item">
              <button type="button" class="range-jump-btn" data-action="jump" data-start="${item.start}">
                <span class="range-time">${timeText}</span>
                ${labelHtml}
              </button>
              <button type="button" class="delete-btn" data-action="delete" data-id="${escapeHtml(item.id)}" title="Delete">✕</button>
            </li>
          `;
        }).join("")}</ul>`;
      }

      rangesContainer.addEventListener("click", (e) => {
        const target = e.target.closest("button");
        if (!target) return;

        const action = target.getAttribute("data-action");
        if (action === "jump") {
          const jumpSec = Number(target.getAttribute("data-start")) || 0;
          sendYTCommand("seekTo", [jumpSec, true]);
          sendYTCommand("playVideo");
          latestPlayerTime = jumpSec;
          showToast(`Jumped to ${formatTime(jumpSec)}`);
        } else if (action === "delete") {
          const id = target.getAttribute("data-id");
          ranges = ranges.filter((r) => r.id !== id);
          saveRangesForVideo();
          renderRanges();
          showToast("Range deleted.");
        }
      });

      function buildExportText() {
        if (!currentVideoId || ranges.length === 0) return "";
        const lectureLink = `https://www.youtube.com/watch?v=${currentVideoId}`;
        const lines = ranges.map((r) => {
          const base = `${formatTime(r.start)} - ${formatTime(r.end)}`;
          return r.label ? `${base} — ${r.label}` : `${base} —`;
        });
        return `${lectureLink}\n\n${lines.join("\n")}`;
      }

      copyAllBtn.addEventListener("click", async () => {
        const text = buildExportText();
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          showToast("Copied all ranges to clipboard.");
        } catch (err) {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); showToast("Copied all ranges to clipboard."); }
          catch (e) { showToast("Could not copy automatically."); }
          document.body.removeChild(ta);
        }
      });

      exportTxtBtn.addEventListener("click", () => {
        const text = buildExportText();
        if (!text || !currentVideoId) return;
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `lecture-ranges-${currentVideoId}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`Exported lecture-ranges-${currentVideoId}.txt`);
      });

      const lastId = safeGetStorage("lrm_last_video_id");
      if (lastId && /^[a-zA-Z0-9_-]{11}$/.test(lastId)) {
        currentVideoId = lastId;
        urlInput.value = `https://www.youtube.com/watch?v=${lastId}`;
        loadRangesForVideo(lastId);
        loadVideo(lastId);
      }

      if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
